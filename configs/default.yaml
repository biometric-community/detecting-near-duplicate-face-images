paper:
  slug: detecting-near-duplicate-face-images
  title: "Detecting Near-Duplicate Face Images"
data:
  root: ../../datasets/lfw/lfw
  n_train_graphs: 200
  n_val_graphs: 40
  n_test_graphs: 40
model:
  name: chebnet
  n_nodes: 10
  max_depth: 4
  hidden: 16
  max_degree: 3
  dropout: 0.5
  feature: pixel
train:
  protocol: subset
  epochs: 20
  batch_size: 8
  lr: 0.01
  weight_decay: 0.0005
  early_stopping: 10
  seed: 42
  num_workers: 2
paths:
  checkpoint_dir: outputs/checkpoints/default
  log_dir: outputs/logs
  pred_dir: outputs/predictions/default
  figure_dir: outputs/figures
device: cuda
cuda_device: 0
