paper:
  slug: detecting-near-duplicate-face-images
  title: "Detecting Near-Duplicate Face Images"
data:
  root: ../../datasets/lfw/lfw
  n_train_graphs: 32
  n_val_graphs: 8
  n_test_graphs: 8
model:
  name: chebnet
  n_nodes: 8
  max_depth: 3
  hidden: 16
  max_degree: 3
  dropout: 0.5
  feature: pixel
train:
  protocol: smoke
  epochs: 2
  batch_size: 4
  lr: 0.01
  weight_decay: 0.0005
  early_stopping: 10
  seed: 42
  num_workers: 0
  log_every: 5
  max_steps: 20
paths:
  checkpoint_dir: outputs/checkpoints/smoke
  log_dir: outputs/logs
  pred_dir: outputs/predictions/smoke
  figure_dir: outputs/figures
device: cuda
cuda_device: 0
